# config/mimir.yaml
# Mimir RF Scanner — Runtime Configuration
#
# Runtime config — loaded at startup by core/config/loader.py via scan.py.
# Edit carefully — all frequency values are in Hz.
#
# LEGAL: All frequencies listed here are legal to receive passively
# in Australia under the Radiocommunications Act 1992 (Cth).
# Jurisdiction: South Australia. Authority: ACMA.

# ── Scanner ───────────────────────────────────────────────────────────
# Gain calibrated for telescopic whip SMA antenna (~1 GHz optimised).
# Poor coupling at FM wavelengths (~3 m) requires gain to compensate.
# lna=24 / vga=26 confirmed safe on live hardware (no ADC saturation).
# Increase if receiving weak signals (APRS, ADS-B, etc.).
scanner:
  frequencies_hz:
    - 98000000
    - 129125000
    - 145175000
    - 162000000
    - 915000000
    - 1090000000
  dwell_time_sec: 0.0
  num_samples: 131072
  lna_gain_db: 24
  vga_gain_db: 26
  amp_enable: false
  queue_maxsize: 20
  # LLM inference server — override with MIMIR_LLM_URL env var
  llm_url: "http://192.168.0.66:8080/v1"
  llm_cooldown_sec: 60         # Seconds to suppress LLM retries after connection failure
  llm_connect_timeout_sec: 5   # Timeout in seconds for the startup health-check probe
  # Min seconds between repeat emissions of an UNCHANGED verdict for the same
  # frequency; changes always emit immediately (e.g. signal_type flip).
  unchanged_emit_interval_sec: 5.0

# ── Dashboard ─────────────────────────────────────────────────────────
dashboard:
  host: "127.0.0.1"
  port: 5000
