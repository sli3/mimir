[project]
name = "mimir"
version = "0.1.0"
description = "AI-Powered RF Spectrum Scanner — passive receive only"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "numpy>=1.26.0",
    "PyYAML>=6.0",
    "requests>=2.31.0",
    "chromadb>=0.5.0",
    "flask>=3.0.0",
    "flask-socketio>=5.3.0",
    "python-engineio>=4.8.0",
    "python-socketio[client]>=5.11.0",
    "huggingface-hub>=0.24.0",
    "scipy>=1.12.0",
    "pyais>=3.0.0",
    # TD-54-6: pin exactly — the DF4/DF5 trust gate's correctness depends on
    # pyModeS 3.3.0's specific crc_valid semantics for these formats. Upgrading
    # to 3.5+ changes crc_valid to None for DF4/5, which would silently reject
    # every DF4/DF5 frame and defeat the gate. See modules/adsb/decoder.py.
    "pyModeS==3.3.0",
    "scikit-learn>=1.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
